# Mango + ada — github.com/hhamaj/ada
# Tema: rofi/foot/tmux/nvim ile aynı monokrom macOS dark.
#
# Bu dosya dotfiles reposundan gelir; makineye özel ayarlar (monitor_rule,
# klavye düzeni, ekstra exec_once) ~/.config/mango/local.conf içine (en altta yüklenir).
# Yollar ~/ ile yazılı: mango exec_once/spawn_shell'i sh ile, spawn'ı wordexp ile açar.
# Doğrulama: mango -p -c ~/.config/mango/config.conf
# Yeniden yükle: SUPER+Shift+c
#
# Kısayollar: SUPER+d başlatıcı (ada) · SUPER+o overview · SUPER+w scroller · SUPER+s monocle
#             SUPER+v dwindle · SUPER+n düzen değiştir · SUPER+, scroller genişliği · SUPER+r resize modu

env=TERMINAL,foot
env=XDG_CURRENT_DESKTOP,mango

exec_once=dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP TERMINAL
# Gentoo/OpenRC: pipewire'ı oturumla başlat (systemd'li dağıtımlarda kullanıcı servisleri halleder)
exec_once=command -v gentoo-pipewire-launcher >/dev/null && exec gentoo-pipewire-launcher restart
exec_once=foot --server
# Duvar kâğıdı: ~/.config/mango/wallpaper bağı (SUPER+Shift+w ile seçilir); yoksa düz renk
exec_once=[ -e ~/.config/mango/wallpaper ] && exec swaybg -i ~/.config/mango/wallpaper -m fill || exec swaybg -c 0d0d0e
# Bar + bildirimler + tepsi: ada (çökerse ada-session yeniden başlatır)
exec_once=~/.local/bin/ada-session
# Pano geçmişi (metin + görsel); SUPER+Shift+v menüsü bunu okur
exec_once=command -v cliphist >/dev/null && wl-paste --type text --watch cliphist store
exec_once=command -v cliphist >/dev/null && wl-paste --type image --watch cliphist store
exec_once=~/.config/swaylock/idle.sh   # 5dk kilit, uyku öncesi kilit
blur=1
blur_layer=1
blur_optimized=0   # 1 = sadece duvar kâğıdını bulanıklaştırır (açık duvar kâğıdında her şey griye kayar)
blur_params_num_passes=3
blur_params_radius=10   # macOS benzeri yoğun bulanıklık; arkadaki pencere kenarları seçilmesin
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2
shadows=0
layer_shadows=1
shadow_only_floating=1
shadows_size=20
shadows_blur=20
shadows_position_x=0
shadows_position_y=5
shadows_color=0x7f
border_radius=20
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0
dim_enable=1
dim_focused_color=0x0
dim_unfocused_color=0x00000040
# ---- Animasyonlar: macOS'a yakın ----
# Pencere açılışı : %85 boyuttan + saydamdan büyüyerek gelir, ~250ms, yumuşak yavaşlama
# Pencere kapanışı: hafifçe küçülüp kaybolur, ~180ms, hızlanarak (macOS gibi kısa)
# Workspace geçişi: Spaces gibi yatay kayma, ~420ms, sonda uzun yumuşak yavaşlama
# Rofi (Spotlight): kısa yakınlaşma + belirme; diğer layer'lar (bar vb.) sadece belirme
# Not: Genie (küçültme) efekti mango'da yok.
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
layer_animation_type_open=fade
layer_animation_type_close=fade
# ada: rofi opens inside the island, which does the animating; its own fade and shadow would show it as a separate window
layer_rule=layer_name:rofi,no_animation:1,no_shadow:1,animation_type_open:none,animation_type_close:none
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.92
zoom_end_ratio=0.95
fade_in_begin_opacity=0.0
fade_out_begin_opacity=1.0
animation_duration_open=220
animation_duration_close=150
animation_duration_move=280
animation_duration_tag=350
animation_duration_focus=0
# cubic-bezier eğrileri (x1,y1,x2,y2)
animation_curve_open=0.22,1.0,0.36,1.0
animation_curve_close=0.32,0.0,0.67,0.0
animation_curve_move=0.22,1.0,0.36,1.0
animation_curve_tag=0.16,1.0,0.3,1.0
animation_curve_focus=0.22,1.0,0.36,1.0
animation_curve_opacity_fade_in=0.22,1.0,0.36,1.0
animation_curve_opacity_fade_out=0.32,0.0,0.67,0.0
overview_gap_inner=20
overview_gap_outer=60
enable_hotarea=0
hotarea_size=10
hotarea_corner=0
hotarea_disable_on_fullscreen=1
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0
new_is_master=0
default_master_factor=0.55
default_master_count=1
tag_num=9
smart_gaps=0
dwindle_smart_split=1
dwindle_preserve_split=0
no_border_when_single=0
focus_on_activate=1
sloppy_focus=1
warp_cursor=0
focus_cross_monitor=0
focus_cross_tag=0
view_current_to_back=1   # aynı workspace tuşuna tekrar basınca öncekine dön (sway: workspace_auto_back_and_forth)
enable_floating_snap=1
snap_distance=30
cursor_theme=DMZ-White
cursor_size=24
drag_tile_to_tile=1
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us
mouse_accel_profile=1
mouse_accel_speed=0.2
mouse_natural_scrolling=0
gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=8
gap_outer_vertical=8
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=0
root_color=0x0d0d0eff
border_color=0x333333ff
focus_color=0xccccccff
urgent_color=0xffffffff
drop_color=0xffffff33
split_color=0xccccccff
maximized_screen_color=0xccccccff
scratchpad_color=0x999999ff
global_color=0x999999ff
overlay_color=0x999999ff

allow_tearing=1

key_mode=default
bind=SUPER,Return,spawn_shell,footclient ~/.local/bin/foot-tmux || foot ~/.local/bin/foot-tmux
# ada'nın içinde açılır; ada çalışmıyorsa düz rofi
bind=SUPER,d,spawn_shell,pkill -USR1 -x ada || ~/.config/rofi/scripts/spotlight.sh
bind=SUPER+SHIFT,v,spawn,~/.config/rofi/scripts/clipboard.sh
bind=SUPER+SHIFT,w,spawn,~/.local/bin/wallpaper
bind=SUPER,b,spawn_shell,gtk-launch "$(xdg-settings get default-web-browser)"
bind=SUPER,e,spawn,thunar
# RSS okuyucu
bind=SUPER,f,spawn,foot -o scrollback.multiplier=1 --app-id=newsboat --title=Newsboat newsboat
bind=SUPER+SHIFT,s,spawn_shell,grim -g "$(slurp)" - | wl-copy --type image/png
bind=NONE,Print,spawn_shell,mkdir -p ~/Pictures/Screenshots && grim ~/Pictures/Screenshots/$(date +%F_%H-%M-%S).png
bind=SUPER,q,spawn,~/.local/bin/terminal-kapat
bind=SUPER+CTRL,q,spawn,~/.config/swaylock/lock.sh
bind=SUPER+SHIFT,q,spawn,~/.local/bin/force-kill
bind=SUPER+SHIFT,f,togglefullscreen,
bind=SUPER,space,togglefloating,
bind=SUPER+SHIFT,minus,minimized,
bind=SUPER,minus,toggle_scratchpad,
bind=SUPER,o,toggleoverview,
bind=SUPER,v,setlayout,dwindle
bind=SUPER,s,setlayout,monocle
bind=SUPER,w,setlayout,scroller
bind=SUPER,n,switch_layout,
bind=SUPER,comma,switch_proportion_preset,
bind=SUPER+SHIFT,c,reload_config,
bind=SUPER+SHIFT,e,spawn,mangonag -t warning -m 'Mango oturumundan çıkmak istiyor musun?' -B 'Evet, çık' 'mmsg dispatch quit'
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=ALT,Tab,focusstack,next
bind=ALT+SHIFT,Tab,focusstack,prev
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,Tab,viewtoright_have_client,0
bind=SUPER+SHIFT,Tab,viewtoleft_have_client,0
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER,r,setkeymode,resize
bindl=NONE,XF86AudioMute,spawn,pactl set-sink-mute @DEFAULT_SINK@ toggle
bindl=NONE,XF86AudioLowerVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ -5%
bindl=NONE,XF86AudioRaiseVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ +5%
bindl=NONE,XF86AudioMicMute,spawn,pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+

key_mode=resize
bind=NONE,h,resizewin,-10,0
bind=NONE,j,resizewin,0,10
bind=NONE,k,resizewin,0,-10
bind=NONE,l,resizewin,10,0
bind=NONE,Left,resizewin,-10,0
bind=NONE,Down,resizewin,0,10
bind=NONE,Up,resizewin,0,-10
bind=NONE,Right,resizewin,10,0
bind=NONE,Return,setkeymode,default
bind=NONE,Escape,setkeymode,default

key_mode=default
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

key_mode=default
axisbind=SUPER,UP,viewtoleft_have_client,0
axisbind=SUPER,DOWN,viewtoright_have_client,0


key_mode=default

tag_rule=id:1,layout_name:dwindle
tag_rule=id:2,layout_name:dwindle
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:dwindle
tag_rule=id:5,layout_name:dwindle
tag_rule=id:6,layout_name:dwindle
tag_rule=id:7,layout_name:dwindle
tag_rule=id:8,layout_name:dwindle
tag_rule=id:9,layout_name:dwindle
window_rule=app_id:conky-dash,is_fullscreen:1
layer_rule=layer_name:selection,no_blur:1,no_animation:1

# Makineye özel: monitor_rule, xkb_rules_layout, ekstra kısayollar (repoda değil; örnek: local.conf.example)
source_optional=~/.config/mango/local.conf
