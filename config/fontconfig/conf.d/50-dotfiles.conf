<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Configs ask for Nerd Font families; if one isn't installed, fall back to
     the plain font instead of a random default. Installed families still win. -->
<fontconfig>
  <alias><family>Inter Nerd Font</family><accept><family>Inter</family></accept></alias>
  <alias><family>GeistMono Nerd Font Mono</family><accept><family>Geist Mono</family><family>MesloLGS Nerd Font Mono</family></accept></alias>
  <alias><family>JetBrainsMono Nerd Font</family><accept><family>JetBrains Mono</family></accept></alias>
</fontconfig>
