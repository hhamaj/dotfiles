# tmux — foot'un sekmeleri. Tema: foot/rofi/mango ile aynı monokrom macOS dark.
# Kısayollar foot.ini [text-bindings] içinde (Ctrl+Shift+T vb. → prefix dizileri).

set -g default-shell /usr/bin/fish
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g escape-time 10
set -g focus-events on
set -g history-limit 10000
set -g mouse on
set -g set-clipboard on            # OSC52 → foot → Wayland panosu
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}#{?#{!=:#{pane_current_command},fish}, · #{pane_current_command},}"

# Pencere başlığı: kapatma onayı (~/.local/bin/terminal-kapat) oturumu buradan okur.
set -g set-titles on
set -g set-titles-string "#S │ #W"

# ── kısayollar (prefix: Ctrl+B) ──
bind c new-window -c "#{pane_current_path}"
bind X kill-window
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf yeniden yüklendi"
bind -T copy-mode-vi v send -X begin-selection
setw -g mode-keys vi

# Tek sekme varken çubuk gizli: düz foot gibi görünür.
set-hook -g window-linked   'if -F "#{>:#{session_windows},1}" "set status on" "set status off"'
set-hook -g window-unlinked 'if -F "#{>:#{session_windows},1}" "set status on" "set status off"'
set-hook -g client-attached 'if -F "#{>:#{session_windows},1}" "set status on" "set status off"'
set-hook -g session-created 'if -F "#{>:#{session_windows},1}" "set status on" "set status off"'

# ── görünüm ──
set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=#8e8e93"
set -g status-left ""
set -g status-left-length 0
set -g status-right "#[fg=#3a3a3c]#[fg=#8e8e93,bg=#3a3a3c] #S #[fg=#3a3a3c,bg=default] "
set -g status-right-length 40
set -g window-status-separator " "

setw -g window-status-format "#[fg=#1c1c1e]#[fg=#8e8e93,bg=#1c1c1e] #I  #W #[fg=#1c1c1e,bg=default]"
setw -g window-status-current-format "#[fg=#f2f2f2]#[fg=#0d0d0e,bg=#f2f2f2,bold] #I  #W #[fg=#f2f2f2,bg=default,nobold]"
setw -g window-status-activity-style "fg=#d1d1d6"
setw -g window-status-bell-style "fg=#ffffff,bold"

set -g pane-border-style "fg=#2c2c2e"
set -g pane-active-border-style "fg=#8e8e93"
set -g pane-border-lines single

set -g message-style "bg=#1c1c1e,fg=#f2f2f2"
set -g message-command-style "bg=#1c1c1e,fg=#f2f2f2"
setw -g mode-style "bg=#3a3a3c,fg=#ffffff"
set -g display-panes-active-colour "#f2f2f2"
set -g display-panes-colour "#8e8e93"
setw -g clock-mode-colour "#f2f2f2"
