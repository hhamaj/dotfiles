# foot — rofi/yambar ile aynı macOS dark tarzı
# Blur: SwayFX'in genel "blur enable" ayarından gelir (saydam pencereler bulanıklaşır).
# Eski config: foot.ini.bak-20261024

[main]
font=GeistMono Nerd Font Mono:size=12
pad=14x12 center     
resize-by-cells=no   
term=xterm-256color

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes
beam-thickness=1.5

[colors]
alpha=0.84            # koyu tema: rofi/yambar/mangobar ile aynı #0d0d0e

background=0d0d0e
foreground=f2f2f2

# Monokrom palet korunuyor, macOS dark gri tonlarına kaydırıldı
regular0=1c1c1e
regular1=8e8e93
regular2=a1a1a6
regular3=b8b8bd
regular4=7c7c80
regular5=a1a1a6
regular6=8e8e93
regular7=d1d1d6

bright0=3a3a3c
bright1=aeaeb2
bright2=c7c7cc
bright3=d8d8dc
bright4=98989d
bright5=c7c7cc
bright6=aeaeb2
bright7=ffffff

cursor=0d0d0e f2f2f2

# macOS tarzı seçim: hafif gri zemin, beyaz yazı
selection-foreground=ffffff
selection-background=3a3a3c

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v

# tmux sekmeleri (~/.config/tmux/tmux.conf, prefix Ctrl+B = \x02)
[text-bindings]
\x02c=Control+Shift+t
\x02X=Control+Shift+w
\x02n=Control+Tab
\x02p=Control+Shift+Tab ISO_Left_Tab
\x02%=Control+Shift+e
\x02"=Control+Shift+d
\x021=Mod1+1
\x022=Mod1+2
\x023=Mod1+3
\x024=Mod1+4
\x025=Mod1+5
\x026=Mod1+6
\x027=Mod1+7
\x028=Mod1+8
\x029=Mod1+9
